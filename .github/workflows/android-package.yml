name: Android Client Package

on:
  push:
    tags:
      - 'android/v*'  # 只有推送这种 tag 才会触发，日常合 main 彻底静默
  workflow_dispatch:   # 保留手动触发，方便调试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/android/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/android/}"
            VERSION_NAME="${TAG#v}"
            # versionCode: 把 1.2.3 转成 10203 形式，便于递增
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
            MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
            echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Extracted version_name=${VERSION_NAME} version_code=${VERSION_CODE}"
          else
            echo "version_name=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "version_code=1" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
            echo "Manual/dev run: version_name=0.0.0-dev version_code=1"
          fi

      - name: Check Android project exists
        id: check
        shell: bash
        run: |
          if [ -f Kotlin/settings.gradle.kts ] || [ -f Kotlin/settings.gradle ] || [ -f Kotlin/app/build.gradle.kts ] || [ -f Kotlin/app/build.gradle ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Kotlin/ 下尚无 Android 工程。"
          fi

      - name: Setup JDK 17
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.exists == 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: >
            tools
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Grant execute permission for gradlew
        if: steps.check.outputs.exists == 'true'
        run: chmod +x Kotlin/gradlew || true

      - name: Inject version into build.gradle.kts
        if: steps.check.outputs.exists == 'true'
        shell: bash
        run: |
          GRADLE="Kotlin/app/build.gradle.kts"
          if [ -f "$GRADLE" ]; then
            sed -i "s/versionCode = .*/versionCode = ${{ steps.ver.outputs.version_code }}/" "$GRADLE"
            sed -i "s/versionName = \".*\"/versionName = \"${{ steps.ver.outputs.version_name }}\"/" "$GRADLE"
            echo "Injected versionName=${{ steps.ver.outputs.version_name }} versionCode=${{ steps.ver.outputs.version_code }}"
            grep -E 'version(Code|Name)' "$GRADLE" || true
          fi

      - name: Build Release APK
        if: steps.check.outputs.exists == 'true'
        working-directory: Kotlin
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -f ./gradlew ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
          echo "=== APK files ==="
          find . -name "*.apk" -type f

      - name: Upload APK artifact
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FeiQ2026-Android-${{ steps.ver.outputs.version_name }}
          path: |
            Kotlin/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create Release on Tag
        if: startsWith(github.ref, 'refs/tags/android/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Kotlin/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          name: Android Release ${{ github.ref_name }}
          body: |
            ## FeiQ2026 Android ${{ steps.ver.outputs.version_name }}
            - versionName: `${{ steps.ver.outputs.version_name }}`
            - versionCode: `${{ steps.ver.outputs.version_code }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
