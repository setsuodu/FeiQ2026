name: WPF Client Package

on:
  push:
    tags:
      - 'wpf/v*'     # 只有推送这种 tag 才会触发
  workflow_dispatch:   # 保留手动触发

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/wpf/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/wpf/}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Inject version into csproj
        shell: pwsh
        run: |
          $csproj = "WPF/src/FeiQ2026/FeiQ2026.csproj"
          $ver = "${{ steps.ver.outputs.version }}"
          # 在 PropertyGroup 里注入 Version / FileVersion / InformationalVersion
          $content = Get-Content $csproj -Raw
          if ($content -notmatch '<Version>') {
            $content = $content -replace '(<PropertyGroup>)', "`$1`n    <Version>$ver</Version>`n    <FileVersion>$ver.0</FileVersion>`n    <InformationalVersion>$ver</InformationalVersion>"
          } else {
            $content = $content -replace '<Version>.*?</Version>', "<Version>$ver</Version>"
            $content = $content -replace '<FileVersion>.*?</FileVersion>', "<FileVersion>$ver.0</FileVersion>"
            $content = $content -replace '<InformationalVersion>.*?</InformationalVersion>', "<InformationalVersion>$ver</InformationalVersion>"
          }
          Set-Content -Path $csproj -Value $content -NoNewline
          Write-Host "Injected Version=$ver"
          Select-String -Path $csproj -Pattern 'Version|FileVersion|InformationalVersion'

      - name: Restore
        run: dotnet restore WPF/src/FeiQ2026/FeiQ2026.csproj

      - name: Publish (self-contained, win-x64)
        # Velopack 建议发布到目录后用 vpk pack；保留单文件便于绿色版下载
        run: >-
          dotnet publish WPF/src/FeiQ2026/FeiQ2026.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Install Velopack CLI (vpk)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version 1.2.161
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Pack with Velopack
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          vpk pack `
            --packId FeiQ2026 `
            --packVersion $ver `
            --packDir .\publish `
            --mainExe FeiQ2026.exe `
            --icon .\WPF\src\FeiQ2026\Assets\app.ico `
            --outputDir .\releases `
            --packTitle "FeiQ 2026" `
            --packAuthors setsuodu
          # 不上传：assets.win.json（CI 元数据）、RELEASES（Squirrel 兼容，本项目未用过）
          Remove-Item -Force -ErrorAction SilentlyContinue `
            .\releases\assets.win.json, `
            .\releases\RELEASES, `
            .\releases\RELEASES-*
          Get-ChildItem .\releases | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeiQ2026-WPF-win-x64-${{ steps.ver.outputs.version }}
          path: |
            publish/FeiQ2026.exe
            releases/
          if-no-files-found: error
          retention-days: 14

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/wpf/v')
        uses: softprops/action-gh-release@v2
        with:
          # 只挂用户需要的产物（已排除 assets.win.json / RELEASES）
          files: |
            publish/FeiQ2026.exe
            releases/FeiQ2026-*-full.nupkg
            releases/FeiQ2026-*-delta.nupkg
            releases/FeiQ2026-win-Setup.exe
            releases/FeiQ2026-win-Portable.zip
            releases/releases.win.json
          fail_on_unmatched_files: false
          generate_release_notes: true
          name: FeiQ 2026 WPF ${{ steps.ver.outputs.version }}
          body: |
            ## FeiQ 2026 WPF ${{ steps.ver.outputs.version }}

            - **Version**: `${{ steps.ver.outputs.version }}`
            - **推荐安装**: `FeiQ2026-win-Setup.exe`（Velopack，支持自动更新）
            - **绿色单文件**: `FeiQ2026.exe`（无自动更新）
            - **更新源**: 本仓库 GitHub Releases

            ### Assets 说明

            | 文件 | 是什么 | 给谁用 |
            |------|--------|--------|
            | `FeiQ2026-win-Setup.exe` | 一键安装包（装到 `%LocalAppData%\FeiQ2026`） | **普通用户首选** |
            | `FeiQ2026-win-Portable.zip` | 绿色便携包（解压即用，可更新） | 不想安装的用户 |
            | `FeiQ2026.exe` | 单文件绿色版 | 纯绿色、不装 Velopack（**无自动更新**） |
            | `FeiQ2026-*-full.nupkg` | 完整更新包 | 已安装用户自动升级（**必须保留**） |
            | `FeiQ2026-*-delta.nupkg` | 增量更新包（若有） | 加速升级，可选 |
            | `releases.win.json` | 版本清单 | 自动更新索引（**必须保留**） |

            > GitHub 自动附带的 `Source code (zip/tar.gz)` 无法关闭；要源码请直接 clone 仓库，不要下这两个包。

            **自动更新最少需要**: `Setup.exe` + `*-full.nupkg` + `releases.win.json`（三者须在同一 Release）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
