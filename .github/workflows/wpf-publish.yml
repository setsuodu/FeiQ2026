name: WPF Client Package

on:
  push:
    tags:
      - 'wpf/v*'     # 只有推送这种 tag 才会触发
  workflow_dispatch:   # 保留手动触发

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore WPF/src/MiniFeiQ/MiniFeiQ.csproj

      - name: Publish (single-file, self-contained, win-x64)
        run: >
          dotnet publish WPF/src/MiniFeiQ/MiniFeiQ.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniFeiQ-WPF-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 14

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/wpf/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MiniFeiQ.exe
          generate_release_notes: true
          name: WPF Release ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
