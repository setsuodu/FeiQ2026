name: Server → GHCR

on:
  push:
    tags:
      - 'server/v*'   # 只有推送这种 tag 才会触发
  workflow_dispatch:   # 保留手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/minifeiq-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 强制启用 latest 标签，确保打 tag 触发时能够覆盖更新 latest
            type=raw,value=latest,enable=true
            type=sha,prefix=
            # 如果是 server/v1.0.0 标签触发，提取出 v1.0.0 作为 Docker Tag
            type=match,pattern=server/(v.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./Server/RelayService
          file: ./Server/RelayService/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
